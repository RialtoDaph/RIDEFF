:root{--night:#14080a;--night-2:#2a1315;--burgundy:#7f1d1d;--orange:#f97316;--orange-ink:#c2410c;--peach:#ffe4c7;--paper:#fff7ed;--ink:#17090a;--muted:#5e4a43;--line:#e6d0b9;
