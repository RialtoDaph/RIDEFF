name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts and the route types (LayoutProps, …) are generated, not committed.
      - run: npx next typegen
      - run: npm run typecheck
      # No secrets needed: without env vars Nana and the newsletter run as mocks.
      - run: npm run build
