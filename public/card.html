<style>
  :root { --bg:#0B0B0C; --card:#111112; --line:#2A2A2C; --ink:#fff; --mute:#CBB7A8; --orange:#FF6A00; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px 24px; }
  .mark { width:96px; height:auto; display:block; margin-bottom:28px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.01em; }
  .role { color:var(--orange); font-size:14px; margin:0 0 6px; font-weight:600; }
  .tag { color:var(--mute); font-size:14px; margin:0 0 28px; }
  a.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 0; border-top:1px solid var(--line);
          color:var(--ink); text-decoration:none; font-size:15px; }
  a.row span:first-child { color:var(--mute); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:700; border-radius:14px; padding:16px; margin-top:12px; font-size:16px; }
  .primary { background:var(--orange); color:#000; margin-top:24px; }
  .ghost { border:1px solid var(--line); color:var(--ink); }
  .primary:active, .ghost:active { opacity:.8; }
</style>
</head>
<body>
  <main class="card">

    <a class="btn primary" href="/">Website öffnen →</a>
    <a class="btn ghost" href="/card.vcf">Kontakt speichern</a>

</body>
</html>
